name: Catalog route inventory probe

on:
  push:
    branches:
      - probe/catalog-routes-20260831-01a059ce

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Run bounded public Catalog probe
        run: node scripts/catalog-route-inventory-probe.mjs
      - name: Commit sanitized result to the temporary branch
        run: |
          test -f diagnostics/catalog-route-inventory.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/catalog-route-inventory.json
          git diff --cached --quiet && exit 1
          git commit -m "Record sanitized Catalog route inventory [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

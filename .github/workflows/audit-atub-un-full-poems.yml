name: Audit ATUB to UN full poems

on:
  push:
    branches:
      - audit/atub-un-full-poems
    paths:
      - functions/audit_atub_un_full_poems.js
      - functions/migrate_atub_to_un_full_poems.js
      - .github/workflows/audit-atub-un-full-poems.yml
  pull_request:
    branches:
      - main
    paths:
      - functions/audit_atub_un_full_poems.js
      - functions/migrate_atub_to_un_full_poems.js
      - .github/workflows/audit-atub-un-full-poems.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POETRY_PLEASE }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gcloud-key.json"

      - name: Run read-only full-poem audit
        working-directory: functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud-key.json
        run: |
          set -euo pipefail
          node audit_atub_un_full_poems.js | tee "$RUNNER_TEMP/atub-un-full-poems-audit.json"

      - name: Run guarded migration dry-run
        working-directory: functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud-key.json
        run: |
          set -euo pipefail
          node migrate_atub_to_un_full_poems.js | tee "$RUNNER_TEMP/atub-un-migration-dry-run.json"

      - name: Apply ATUB to UN migration
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[apply-atub-un]')
        working-directory: functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud-key.json
          APPLY_ATUB_UN_MIGRATION: YES
        run: |
          set -euo pipefail
          node migrate_atub_to_un_full_poems.js | tee "$RUNNER_TEMP/atub-un-migration-apply.json"

      - name: Run independent post-apply audit
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[apply-atub-un]')
        working-directory: functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud-key.json
        run: |
          set -euo pipefail
          node audit_atub_un_full_poems.js | tee "$RUNNER_TEMP/atub-un-post-apply-audit.json"

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atub-un-full-poems-audit
          path: |
            ${{ runner.temp }}/atub-un-full-poems-audit.json
            ${{ runner.temp }}/atub-un-migration-dry-run.json
            ${{ runner.temp }}/atub-un-migration-apply.json
            ${{ runner.temp }}/atub-un-post-apply-audit.json
          if-no-files-found: warn
          retention-days: 7

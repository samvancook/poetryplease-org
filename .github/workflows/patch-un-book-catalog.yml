name: Patch UN book catalog lookup

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/patch-un-book-catalog.yml
      - functions/book-catalog-lookup.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ github.token }}

      - name: Patch Ayanna Florence catalog identity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'functions/book-catalog-lookup.json';
          const catalog = JSON.parse(fs.readFileSync(path, 'utf8'));
          const matches = catalog.filter((row) => row.authorKey === 'ayanna florence');
          if (matches.length !== 1) throw new Error(`Expected exactly one Ayanna Florence catalog row; found ${matches.length}`);
          const row = matches[0];
          row.title = 'unreliable narrator';
          row.author = 'Ayanna Florence';
          row.releaseCatalog = 'Fall 2026';
          row.bookLink = 'https://buttonpoetry.com/product/unreliable-narrator/';
          row.bookShortener = 'UN';
          row.pubDate = '01/26/2027';
          row.titleKeys = ['unreliable narrator', 'all the ugly bits'];
          row.authorKey = 'ayanna florence';
          fs.writeFileSync(path, JSON.stringify(catalog, null, 2) + '\n');
          NODE

      - name: Verify patch
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('functions/book-catalog-lookup.json', 'utf8'));
          const ayanna = catalog.filter((row) => row.authorKey === 'ayanna florence');
          if (ayanna.length !== 1) throw new Error('Ayanna row count changed');
          const row = ayanna[0];
          if (row.bookShortener !== 'UN') throw new Error('UN code not applied');
          if (row.title !== 'unreliable narrator') throw new Error('Current title not applied');
          if (row.pubDate !== '01/26/2027') throw new Error('Canonical pub date not applied');
          if (!row.titleKeys.includes('all the ugly bits')) throw new Error('Historical title alias missing');
          if (catalog.some((r) => r.bookShortener === 'ATUB')) throw new Error('Stale ATUB mapping remains');
          console.log(JSON.stringify(row, null, 2));
          NODE

      - name: Commit structural JSON patch
        run: |
          if git diff --quiet -- functions/book-catalog-lookup.json; then
            echo 'Catalog already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/book-catalog-lookup.json
          git commit -m 'Fix UN book catalog identity'
          git push origin HEAD:${{ github.head_ref }}

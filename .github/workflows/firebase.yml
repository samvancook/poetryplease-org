name: Deploy to Firebase

# A manual preview-backfill run gets its own group so it can never displace a
# queued deployment.
concurrency:
  group: firebase-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.preview_backfill != 'none' && '-preview-backfill' || '' }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      - '**'        # run on every branch push (for previews)
  pull_request:
    branches:
      - '**'        # run on PRs too
  workflow_dispatch:  # allow manual runs from the Actions tab
    inputs:
      preview_backfill:
        # Left at "none", a manual run tests and deploys as before. Any other
        # choice runs only the display_preview_backfill job and deploys nothing.
        #   status        read-only count of graphics with and without a light preview
        #   request       asks for previews on the next <preview_limit> graphics that need one
        #   retry-stalled asks again for graphics requested earlier that still have none
        #   refresh-feed  one content-cache refresh so finished previews reach the feed
        #   list-stalled  read-only: prints every stalled graphic's image URL and last error
        #   catalog-export read-only: prints the graphics as JSON lines of 10 (title, author, book, image URL, hidden)
        #   diagnose-stalled read-only: downloads each stalled original and groups them by cause
        #   restore-dry-run  read-only: checks the first <preview_limit> rows of the restore plan
        #   restore-originals puts broken originals back (docs/handoffs/graphic-restore-plan-2026-11-14.json)
        #   reattach-dry-run  read-only: checks the re-attach plan (docs/handoffs/graphic-reattach-plan-2026-11-15.json)
        #   catalog-poems-export prints the Catalog poem texts for every book named on a graphic
        #   retitle-dry-run / retitle-graphics rename quote images to the poem their image shows
        #   reattach-originals re-attaches graphics whose hosted upload is not an image, from Drive
        #   dbat-title-fix-dry-run read-only: lists the DON'T BE AFRAID TO BE BAD INT graphics whose
        #                    title and image name say "Promt" (and three other typos) and the fixes planned
        #   dbat-title-fix   copies each image to its corrected name (the old object stays for the
        #                    social calendars), then fixes the graphic's title and image link
        #   excerpt-import-dry-run  read-only: checks <excerpt_batch> against the library's excerpts
        #   excerpt-import   imports the picks in <excerpt_batch> that the library does not have yet
        #   read-log-summary read-only: counts the last 24 hours of the app's Firestore
        #                    read log lines (full_votes_scan, author_votes_scoped_read, ...)
        #                    and its busiest request paths, from Cloud Logging
        #   signed-in-probe  not a backfill: runs only the signed_in_probe job, which measures
        #                    startup on the live site signed in as the test reader
        #   signed-in-probe-author  the same, with the test reader marked as an author
        description: Display preview backfill (none = normal deploy)
        type: choice
        default: none
        options: [none, status, request, retry-stalled, refresh-feed, list-stalled, catalog-export, catalog-poems-export, diagnose-stalled, restore-dry-run, restore-originals, reattach-dry-run, reattach-originals, retitle-dry-run, retitle-graphics, dbat-title-fix-dry-run, dbat-title-fix, excerpt-import-dry-run, excerpt-import, read-log-summary, signed-in-probe, signed-in-probe-author]
      preview_limit:
        description: How many graphics to request (1-5000); used by request and retry-stalled
        required: false
        default: '25'
      excerpt_batch:
        description: Excerpt batch file under imports/ (excerpt-import choices only)
        required: false
        default: ''

jobs:
  test_functions:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.preview_backfill != 'none') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Validate function modules
        working-directory: functions
        run: |
          node --check index.js
          node --check import-jobs.js
          node --check manuscript-reconciliation-phase2.js

      - name: Run function tests
        working-directory: functions
        run: node --test video-performance-context.test.js video-renditions.test.js uploader-helpers.test.js manuscript-reconciliation-phase2.test.js weaver-video-intake.test.js author-vote-reads.test.js voted-ids-cache.test.js own-author-name.test.js scroll-feed.test.js display-preview.test.js diagnose-display-previews.test.js restore-graphic-original.test.js graphic-retitle.test.js graphic-title-fix.test.js excerpt-batch-import.test.js content-cache-policy.test.js admin-content-library.test.js flagged-content-snapshot.test.js votes-ledger.test.js scoreboard-content.test.js explorer-youtube.test.js social-top-posts.test.js swipe-feed.test.js

      - name: Run Explorer tests
        run: node --test tests/explorer.test.js

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase CLI for emulator tests
        run: npm install --global firebase-tools

      - name: Write synthetic emulator secret overrides
        working-directory: functions
        run: printf "%s\\n" "POETRY_PLEASE_API_KEY=emulator-only" "PIG_POETRY_PLEASE_API_KEY=emulator-only" > .secret.local

      - name: Run isolated authorization emulator integration test
        env:
          GCLOUD_PROJECT: demo-poetry-please
          FIREBASE_CONFIG: '{"projectId":"demo-poetry-please"}'
        run: firebase emulators:exec --project demo-poetry-please --only auth,firestore,functions "node --test functions/manuscript-reconciliation.emulator.test.js"

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.preview_backfill != 'none') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine changed areas
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            functions:
              - 'functions/**'
              - '.github/workflows/firebase.yml'
            hosting:
              - 'public/**'
              - 'firebase.json'
              - '.firebaserc'
              - 'index.html'
              - 'mobile.html'
              - 'detect.html'
              - 'app.js'
              - 'styles.css'

      - name: Debug paths-filter outputs
        run: |
          echo "functions changed? -> ${{ steps.changes.outputs.functions }}"
          echo "hosting   changed? -> ${{ steps.changes.outputs.hosting }}"
          echo "Changed files vs previous commit:"
          git --no-pager diff --name-only HEAD~1 HEAD || true

      - name: Show repo tree (top level)
        run: ls -la

      - name: Print firebase.json and .firebaserc if present
        run: |
          test -f firebase.json && echo "=== firebase.json ===" && cat firebase.json || echo "firebase.json NOT FOUND"
          test -f .firebaserc  && echo "=== .firebaserc  ===" && cat .firebaserc  || echo ".firebaserc NOT FOUND"

      - name: Functions deps (if functions/ changed)
        if: steps.changes.outputs.functions == 'true'
        run: |
          echo "Installing functions deps…"
          cd functions
          if [ -f package.json ]; then
            npm install --no-audit --no-fund
          else
            echo "functions/package.json NOT FOUND"; exit 2
          fi

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/609992589187/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: firebase-adminsdk-k1gj0@poetry-please.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Verify keyless deployment identity
        run: |
          set -euo pipefail
          test -n "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test ! -f "$RUNNER_TEMP/gcloud-key.json"
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,"utf8")); if(p.type!=="external_account") process.exit(1); if(!String(p.service_account_impersonation_url||"").includes("/serviceAccounts/firebase-adminsdk-k1gj0@poetry-please.iam.gserviceaccount.com:generateAccessToken")) process.exit(1);'
          gcloud auth print-access-token >/dev/null
          echo "Verified keyless GitHub OIDC authentication."


      - name: Verify production API-key secrets
        run: |
          set -euo pipefail
          gcloud config set project poetry-please --quiet
          for secret in POETRY_PLEASE_API_KEY PIG_POETRY_PLEASE_API_KEY; do
            gcloud secrets describe "$secret" --project poetry-please >/dev/null
            test -n "$(gcloud secrets versions list "$secret" --project poetry-please --filter='state=ENABLED' --format='value(name)' --limit=1)"
          done
          echo "Required Poetry Please secret bindings are present."

      - name: Firebase whoami / projects (sanity)
        run: |
          firebase --version
          firebase projects:list --json || true
          firebase use poetry-please || true

      - name: Deploy Hosting (debug)
        run: |
          if [ -f firebase.json ]; then
            echo "Deploying HOSTING…"
            firebase --project poetry-please deploy --only hosting:poetryplease-org --debug
          else
            echo "Skipping hosting: firebase.json missing"; exit 4
          fi

      - name: Deploy Functions (debug)
        if: steps.changes.outputs.functions == 'true'
        run: |
          echo "Deploying FUNCTIONS…"
          # --force: the CLI refuses, without a prompt it can answer here, any
          # deploy that raises the minimum bill (e.g. more memory on a
          # minInstances function). Such changes are approved in their PR.
          firebase --project poetry-please deploy --only functions --force --debug

      - name: Authenticated internal API smoke tests
        if: steps.changes.outputs.functions == 'true'
        run: |
          set -euo pipefail
          poetry_key="$(gcloud secrets versions access latest --secret=POETRY_PLEASE_API_KEY --project poetry-please)"
          pig_key="$(gcloud secrets versions access latest --secret=PIG_POETRY_PLEASE_API_KEY --project poetry-please)"
          trap 'unset poetry_key pig_key' EXIT
          curl --fail --silent --show-error --retry 6 --retry-delay 10             -H "x-api-key: $poetry_key"             "https://poetryplease.org/api/internal/repairRequests?status=requested" >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 10             -H "x-api-key: $pig_key"             "https://poetryplease.org/api/internal/coverageCounts?lane=INT_FPI" >/dev/null
          echo "Authenticated Poetry Please smoke tests passed."

      - name: Public health and anonymous bootstrap timing
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-delay 10 "https://poetryplease.org/api/healthz"
          echo
          # Read-only requests from a fixed synthetic visitor that never votes.
          for body in '{"anonId":"local-citiming01","limit":20,"welcome":true,"includeRatingsSummary":false}' \
                      '{"anonId":"local-citiming01","limit":20,"welcome":true,"includeRatingsSummary":false}' \
                      '{"anonId":"local-citiming01","limit":20,"includeRatingsSummary":false}'; do
            curl --fail --silent --show-error --retry 3 --retry-delay 10 \
              -X POST -H "Content-Type: application/json" -d "$body" \
              -D /tmp/bootstrap-headers.txt -o /dev/null \
              -w "bootstrap http=%{http_code} total=%{time_total}s bytes=%{size_download}\n" \
              "https://poetryplease.org/api/bootstrap"
            grep -i '^server-timing:' /tmp/bootstrap-headers.txt || echo "server-timing: not present"
          done


      - name: Apply safe P.I.G. ID hygiene migration
        if: steps.changes.outputs.functions == 'true' && contains(github.event.head_commit.message, '[apply-pig-hygiene]')
        run: |
          set -euo pipefail
          poetry_key="$(gcloud secrets versions access latest --secret=POETRY_PLEASE_API_KEY --project poetry-please)"
          trap 'unset poetry_key' EXIT
          curl --fail --silent --show-error --retry 6 --retry-delay 10 \
            -X POST \
            -H "x-api-key: $poetry_key" \
            "https://poetryplease.org/api/internal/idHygiene/applyPig"
          echo
          echo "Safe P.I.G. ID hygiene migration completed."


  # ------------------------------------------------------------
  # DISPLAY PREVIEW BACKFILL, started by hand only. It deploys nothing.
  # It lives in this workflow because Google Cloud only accepts this
  # workflow's identity. Previews are built by the graphicdisplaypreview
  # function. Originals are never modified, and a preview is removed by
  # clearing its fields on the graphic.
  # ------------------------------------------------------------
  display_preview_backfill:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.preview_backfill != 'none' && !startsWith(inputs.preview_backfill, 'signed-in-probe') }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
      id-token: write
    steps:
      # Checkout must come before sign-in: it cleans the folder that holds
      # the credentials file.
      - name: Checkout (diagnose and restore only)
        if: ${{ contains(fromJSON('["diagnose-stalled","restore-dry-run","restore-originals","reattach-dry-run","reattach-originals","retitle-dry-run","retitle-graphics","excerpt-import-dry-run","excerpt-import"]'), inputs.preview_backfill) }}
        uses: actions/checkout@v4

      - name: Set up Node (diagnose and restore only)
        if: ${{ contains(fromJSON('["diagnose-stalled","restore-dry-run","restore-originals","reattach-dry-run","reattach-originals","retitle-dry-run","retitle-graphics","excerpt-import-dry-run","excerpt-import"]'), inputs.preview_backfill) }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install function dependencies (diagnose and restore only)
        if: ${{ contains(fromJSON('["diagnose-stalled","restore-dry-run","restore-originals","reattach-dry-run","reattach-originals","retitle-dry-run","retitle-graphics","excerpt-import-dry-run","excerpt-import"]'), inputs.preview_backfill) }}
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/609992589187/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: firebase-adminsdk-k1gj0@poetry-please.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Run
        env:
          ACTION: ${{ inputs.preview_backfill }}
          LIMIT: ${{ inputs.preview_limit }}
          EXCERPT_BATCH: ${{ inputs.excerpt_batch }}
        run: |
          set -euo pipefail
          case "$LIMIT" in ''|*[!0-9]*) echo "limit must be a whole number"; exit 2;; esac
          if [ "$LIMIT" -lt 1 ] || [ "$LIMIT" -gt 5000 ]; then echo "limit must be 1-5000"; exit 2; fi
          poetry_key="$(gcloud secrets versions access latest --secret=POETRY_PLEASE_API_KEY --project poetry-please)"
          trap 'unset poetry_key' EXIT
          base="https://poetryplease.org/api/internal/displayPreviews"
          get() {
            curl --fail-with-body --silent --show-error --max-time 120 --retry 3 --retry-delay 10 -H "x-api-key: $poetry_key" "$base/$1"
          }
          post() {
            curl --fail-with-body --silent --show-error --max-time 58 -X POST \
              -H "x-api-key: $poetry_key" -H "Content-Type: application/json" -d "$2" "$base/$1"
          }
          # Reads the library once, then asks for previews 15 graphics at a
          # time (the server spaces them three seconds apart). Stops at the
          # first failed batch; a rerun picks up whatever is still pending.
          run_batches() {
            get "status?list=$1" | jq -c --argjson limit "$LIMIT" '.ids[:$limit] as $all | range(0; $all | length; 15) | {ids: $all[.:. + 15]}' > batches.jsonl
            total="$(jq -s 'map(.ids | length) | add // 0' batches.jsonl)"
            echo "Requesting previews for $total graphics."
            done_count=0
            while IFS= read -r batch; do
              result="$(post request "$batch")"
              done_count=$((done_count + $(jq '.requested' <<<"$result")))
              missing="$(jq -c '.missing' <<<"$result")"
              if [ "$missing" != "[]" ]; then echo "Not found: $missing"; fi
              echo "Requested $done_count of $total"
            done < batches.jsonl
            echo "Waiting for the last previews to build..."
            sleep 60
            get status | jq 'del(.recent)'
          }
          summarize_restore() {
            echo "Summary by status:"
            jq -s 'group_by(.status) | map({status: .[0].status, count: length})' "$RUNNER_TEMP/restore-results.jsonl"
            echo "Not restored, by reason:"
            jq -s 'map(select(.status == "failed" or .status == "skipped")) | group_by(.error // .reason) | map({why: (.[0].error // .[0].reason), count: length, sample: [.[:3][].id]})' "$RUNNER_TEMP/restore-results.jsonl"
          }
          case "$ACTION" in
            status) get status | jq . ;;
            request) run_batches pending ;;
            retry-stalled) run_batches stalled ;;
            refresh-feed) post refreshFeed '{}' | jq . ;;
            list-stalled) get "status?list=stalled-details" | jq -c '.stalledDetails[]' ;;
            catalog-export) get "catalog" | jq -c '.items as $a | range(0; $a | length; 10) | $a[.:. + 10]' ;;
            catalog-poems-export)
              # One line per book: every poem the Catalog holds for each book named on a graphic.
              get "catalog" | jq -r '[.items[].book | select(. != "")] | unique[]' > "$RUNNER_TEMP/books.txt"
              while IFS= read -r book; do
                enc="$(jq -rn --arg b "$book" '$b|@uri')"
                curl --silent --show-error --max-time 30 "https://button-poetry-catalog-350789123099.us-central1.run.app/books/$enc/poems?limit=1000" \
                  | jq -c --arg b "$book" '{book: $b, poems: [ (if type == "array" then .[] else empty end) | {t: .title, k: .poem_key, p: (.is_likely_poem // null), x: ((.served_text // .cleaned_text // .text // "") | .[0:6000])} ]}' \
                  || echo "{\"book\": $(jq -n --arg b "$book" '$b'), \"error\": true}"
              done < "$RUNNER_TEMP/books.txt" ;;
            reattach-dry-run|reattach-originals)
              dry="$([ "$ACTION" = reattach-dry-run ] && echo true || echo false)"
              post reattachOriginals "$(jq -c --argjson dry "$dry" '{dryRun: $dry, items: .items[:6]}' docs/handoffs/graphic-reattach-plan-2026-11-15.json)" | jq . ;;
            retitle-dry-run|retitle-graphics)
              # 50 records per call; each record is checked against the title in the plan first.
              dry="$([ "$ACTION" = retitle-dry-run ] && echo true || echo false)"
              jq -c --argjson dry "$dry" '.items as $all | range(0; $all | length; 50) | {dryRun: $dry, items: $all[.:. + 50]}' \
                docs/handoffs/graphic-retitle-plan-2026-11-17.json > "$RUNNER_TEMP/retitle-batches.jsonl"
              : > "$RUNNER_TEMP/retitle-results.jsonl"
              while IFS= read -r batch; do
                post retitle "$batch" | jq -c '.results[]' | tee -a "$RUNNER_TEMP/retitle-results.jsonl"
              done < "$RUNNER_TEMP/retitle-batches.jsonl"
              jq -s 'group_by(.status + ":" + (.reason // "")) | map({(.[0].status + (if .[0].reason then ":" + .[0].reason else "" end)): length}) | add' "$RUNNER_TEMP/retitle-results.jsonl"
              if [ "$ACTION" = retitle-graphics ]; then post refreshFeed '{}' | jq -c .; fi ;;
            restore-dry-run)
              # Six graphics per call keeps each call inside Hosting's 60 s limit.
              jq -c --argjson limit "$LIMIT" \
                '.items[:$limit] as $all | range(0; $all | length; 6) | {dryRun: true, items: $all[.:. + 6]}' \
                docs/handoffs/graphic-restore-plan-2026-11-14.json > "$RUNNER_TEMP/restore-batches.jsonl"
              : > "$RUNNER_TEMP/restore-results.jsonl"
              while IFS= read -r batch; do
                post restoreOriginals "$batch" | jq -c '.results[]' | tee -a "$RUNNER_TEMP/restore-results.jsonl"
              done < "$RUNNER_TEMP/restore-batches.jsonl"
              summarize_restore ;;
            restore-originals)
              # The app's runtime account cannot write poetrypleasebucket, so
              # this job writes it: the app fetches and verifies each image
              # (mode fetch), this job backs up the error stub and uploads the
              # image to the exact object name, then the app confirms it and
              # asks for a preview (mode finish). Rerunning is safe: restored
              # graphics come back as already_ok.
              bucket_api="https://storage.googleapis.com/storage/v1/b/poetrypleasebucket"
              token="$(gcloud auth print-access-token)"
              allowed="$(curl --fail-with-body -sS -H "Authorization: Bearer $token" \
                "$bucket_api/iam/testPermissions?permissions=storage.objects.create&permissions=storage.objects.get" | jq -c '.permissions // []')"
              echo "This job's permissions on poetrypleasebucket: $allowed"
              jq -e 'index("storage.objects.create")' <<<"$allowed" >/dev/null || { echo "Cannot write poetrypleasebucket; nothing was changed."; exit 3; }
              jq -c --argjson limit "$LIMIT" '.items[:$limit][]' docs/handoffs/graphic-restore-plan-2026-11-14.json > "$RUNNER_TEMP/restore-items.jsonl"
              : > "$RUNNER_TEMP/restore-results.jsonl"
              count=0
              while IFS= read -r item; do
                count=$((count + 1))
                [ $((count % 100)) -eq 0 ] && token="$(gcloud auth print-access-token)"
                fetched="$(post restoreOriginals "$(jq -c '{mode: "fetch", items: [.]}' <<<"$item")" | jq -c '.results[0]')"
                if [ "$(jq -r '.status' <<<"$fetched")" != fetched ]; then
                  jq -c 'del(.base64)' <<<"$fetched" | tee -a "$RUNNER_TEMP/restore-results.jsonl"; continue
                fi
                object="$(jq -r '.object | @uri' <<<"$fetched")"
                backup="$(jq -r '.backupObject // "" | @uri' <<<"$fetched")"
                mime="$(jq -r '.mimeType' <<<"$fetched")"
                jq -r '.base64' <<<"$fetched" | base64 -d > "$RUNNER_TEMP/restore-image"
                if [ -n "$backup" ]; then
                  curl --fail-with-body -sS -o /dev/null -X POST -H "Authorization: Bearer $token" -H "Content-Length: 0" \
                    "$bucket_api/o/$object/copyTo/b/poetrypleasebucket/o/$backup"
                fi
                curl --fail-with-body -sS -o /dev/null -X POST -H "Authorization: Bearer $token" -H "Content-Type: $mime" \
                  --data-binary @"$RUNNER_TEMP/restore-image" \
                  "https://storage.googleapis.com/upload/storage/v1/b/poetrypleasebucket/o?uploadType=media&name=$object"
                post restoreOriginals "$(jq -c '{mode: "finish", items: [.]}' <<<"$item")" | jq -c '.results[0]' \
                  | tee -a "$RUNNER_TEMP/restore-results.jsonl"
              done < "$RUNNER_TEMP/restore-items.jsonl"
              summarize_restore ;;
            dbat-title-fix-dry-run|dbat-title-fix)
              # Handoff 2026-11-20 (Social Publishing): twelve DON'T BE AFRAID TO
              # BE BAD INT graphics carry typos in their title and image name.
              # Copies each image to the corrected name and never deletes the old
              # one: the calendars link to it for posts through 17 Dec 2026.
              prefix="https://storage.googleapis.com/poetrypleasebucket/"
              get "catalog" | jq -c --arg prefix "$prefix" '
                def fix: gsub("Promt"; "Prompt") | gsub("Curce"; "Curse") | gsub("Assult"; "Assault") | gsub("Statment"; "Statement");
                .items[]
                | select(.imageUrl | startswith($prefix + "DBAT%20-%20INT%20"))
                | select(.imageUrl | contains("Promt"))
                | {id, expectTitle: .title, title: (.title | fix), expectImageUrl: .imageUrl, imageUrl: (.imageUrl | fix)}
              ' > "$RUNNER_TEMP/title-fix.jsonl"
              count="$(wc -l < "$RUNNER_TEMP/title-fix.jsonl")"
              echo "Graphics found: $count"
              cat "$RUNNER_TEMP/title-fix.jsonl"
              unchanged="$(jq -s 'map(select(.expectTitle == .title)) | length' "$RUNNER_TEMP/title-fix.jsonl")"
              if [ "$count" -ne 12 ] || [ "$unchanged" -ne 0 ]; then
                echo "Expected 12 graphics, each with a misspelled title (found $count, $unchanged with a clean title). Nothing was changed."; exit 3
              fi
              bucket_api="https://storage.googleapis.com/storage/v1/b/poetrypleasebucket"
              token="$(gcloud auth print-access-token)"
              while IFS= read -r item; do
                old="$(jq -r --arg prefix "$prefix" '.expectImageUrl | ltrimstr($prefix)' <<<"$item")"
                new="$(jq -r --arg prefix "$prefix" '.imageUrl | ltrimstr($prefix)' <<<"$item")"
                old_status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "$bucket_api/o/$old")"
                new_status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "$bucket_api/o/$new")"
                echo "old $old_status new $new_status  $new"
                if [ "$ACTION" = dbat-title-fix ] && [ "$new_status" = 404 ] && [ "$old_status" = 200 ]; then
                  curl --fail-with-body -sS -o /dev/null -X POST -H "Authorization: Bearer $token" -H "Content-Length: 0" \
                    "$bucket_api/o/$old/copyTo/b/poetrypleasebucket/o/$new"
                  echo "  copied"
                fi
              done < "$RUNNER_TEMP/title-fix.jsonl"
              dry="$([ "$ACTION" = dbat-title-fix-dry-run ] && echo true || echo false)"
              post fixTitles "$(jq -s -c --argjson dry "$dry" '{dryRun: $dry, items: .}' "$RUNNER_TEMP/title-fix.jsonl")" | jq -c '.results[]'
              if [ "$ACTION" = dbat-title-fix ]; then post refreshFeed '{}' | jq -c .; fi ;;
            excerpt-import-dry-run|excerpt-import)
              case "$EXCERPT_BATCH" in imports/*.json) ;; *) echo "excerpt_batch must be a .json file under imports/"; exit 2;; esac
              case "$EXCERPT_BATCH" in *..*) echo "excerpt_batch must not contain .."; exit 2;; esac
              test -f "$EXCERPT_BATCH" || { echo "$EXCERPT_BATCH not found"; exit 2; }
              (cd functions && node excerpt-batch-import.mjs plan "../$EXCERPT_BATCH" "$RUNNER_TEMP/excerpt-payload.json")
              count="$(jq '.records | length' "$RUNNER_TEMP/excerpt-payload.json")"
              if [ "$ACTION" = excerpt-import-dry-run ] || [ "$count" -eq 0 ]; then echo "Nothing imported."; exit 0; fi
              curl --fail-with-body --silent --show-error --max-time 58 -X POST \
                -H "x-api-key: $poetry_key" -H "Content-Type: application/json" \
                --data-binary @"$RUNNER_TEMP/excerpt-payload.json" \
                "https://poetryplease.org/api/internal/weaverImport" \
                | jq '{importLedgerId, createdCount, updatedCount, errorCount, results}'
              echo "Checking again after the import:"
              (cd functions && node excerpt-batch-import.mjs plan "../$EXCERPT_BATCH" "$RUNNER_TEMP/excerpt-payload-after.json") ;;
            diagnose-stalled)
              get "status?list=stalled-details" | jq -c '.stalledDetails[]' > "$RUNNER_TEMP/stalled.jsonl"
              (cd functions && node diagnose-display-previews.mjs "$RUNNER_TEMP/stalled.jsonl") ;;
            read-log-summary)
              # Read-only. Totals the read-related log lines the app writes, so a
              # cost bump can be traced to the code path that read the documents.
              hours="$LIMIT"; [ "$hours" -gt 168 ] && hours=168
              since="$(date -u -d "-${hours} hours" +%Y-%m-%dT%H:%M:%SZ)"
              events='full_votes_scan|author_votes_scoped_read|votes_ledger_sync|flagged_content_source|ratings_summary_source|ratings_snapshot|scoreboard|content_snapshot|staff_review'
              gcloud logging read --project poetry-please --limit 50000 --format=json \
                "timestamp>=\"$since\" AND (textPayload=~\"($events)\" OR jsonPayload.message=~\"($events)\")" \
                > "$RUNNER_TEMP/read-logs.json"
              echo "Read-related log lines since $since, by event and reason (lines, documents read):"
              jq -r '.[] | (.textPayload // .jsonPayload.message // "") as $t
                | ($t | capture("^(?<e>[a-z_]+)") .e) as $e
                | (($t | capture("reason: .(?<r>[^'"'"'\",}]+)") .r) // "") as $r
                | (($t | capture("documentCount: (?<n>[0-9]+)") .n | tonumber) // 0) as $n
                | [$e, $r, $n] | @tsv' "$RUNNER_TEMP/read-logs.json" \
                | awk -F'\t' '{k=$1" "$2; c[k]++; d[k]+=$3} END {for (k in c) printf "%8d lines %12d docs  %s\n", c[k], d[k], k}' | sort -k3 -nr
              echo "Busiest request paths since $since (requests):"
              gcloud logging read --project poetry-please --limit 50000 --format='value(httpRequest.requestUrl)' \
                "timestamp>=\"$since\" AND httpRequest.requestUrl:\"/\"" \
                | sed -E 's#^https?://[^/]+##; s#\?.*$##' | sort | uniq -c | sort -nr | head -40 ;;
            *) echo "unknown action"; exit 2 ;;
          esac

  # ------------------------------------------------------------
  # SIGNED-IN STARTUP PROBE, started by hand only. It deploys nothing.
  # Measures the first card on the live site while signed in as the test
  # reader "startup-probe-reader" (never votes; an author only for the
  # signed-in-probe-author choice). It lives in this
  # workflow because Google Cloud only accepts this workflow's identity,
  # which is what issues the reader's one-hour sign-in token.
  # ------------------------------------------------------------
  signed_in_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && startsWith(inputs.preview_backfill, 'signed-in-probe') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/609992589187/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: firebase-adminsdk-k1gj0@poetry-please.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Install probe dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/probe" && cd "$RUNNER_TEMP/probe"
          npm init -y >/dev/null
          # Uses the Chrome already on the runner, so nothing else is downloaded.
          npm install --no-audit --no-fund playwright-core@1.49.1 firebase-admin@14.2.0 >/dev/null

      - name: Signed-in browser start on Desktop, classic mobile and Swipe
        env:
          PP_PROBE_SERVICE_ACCOUNT: firebase-adminsdk-k1gj0@poetry-please.iam.gserviceaccount.com
          PP_PROBE_READER_ROLE: ${{ inputs.preview_backfill == 'signed-in-probe-author' && 'author' || 'reader' }}
        run: |
          set -euo pipefail
          cp scripts/startup-probe.mjs scripts/startup-probe-token.mjs "$RUNNER_TEMP/probe/"
          cd "$RUNNER_TEMP/probe"
          export PP_PROBE_TOKEN_FILE="$RUNNER_TEMP/probe-token"
          node startup-probe-token.mjs
          PP_PROBE_CUSTOM_TOKEN="$(cat "$PP_PROBE_TOKEN_FILE")"
          echo "::add-mask::$PP_PROBE_CUSTOM_TOKEN"
          rm -f "$PP_PROBE_TOKEN_FILE"
          export PP_PROBE_CUSTOM_TOKEN
          # The probe must not inherit the cloud identity.
          env -u GOOGLE_APPLICATION_CREDENTIALS -u CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE -u GOOGLE_GHA_CREDS_PATH \
            node startup-probe.mjs

  # ------------------------------------------------------------
  # DEPLOY PREVIEW CHANNEL for non-main branches
  # ------------------------------------------------------------
  # Preview channels are paused; branch tests and main deployment still run.
  deploy_preview:
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install preview function dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/pp-20260901-manuscript-reconciliation-phase-2'
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/609992589187/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: firebase-adminsdk-k1gj0@poetry-please.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Verify keyless deployment identity
        run: |
          set -euo pipefail
          test -n "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test ! -f "$RUNNER_TEMP/gcloud-key.json"
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,"utf8")); if(p.type!=="external_account") process.exit(1); if(!String(p.service_account_impersonation_url||"").includes("/serviceAccounts/firebase-adminsdk-k1gj0@poetry-please.iam.gserviceaccount.com:generateAccessToken")) process.exit(1);'
          gcloud auth print-access-token >/dev/null
          echo "Verified keyless GitHub OIDC authentication."


      - name: Verify the isolated Phase 2 runtime identity exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/pp-20260901-manuscript-reconciliation-phase-2'
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          runtime_sa="manuscript-phase2-preview@poetry-please.iam.gserviceaccount.com"
          gcloud iam service-accounts describe "$runtime_sa" --project poetry-please --format='value(email)'
          echo "Runtime identity exists."

      - name: Deploy isolated manuscript reconciliation preview function
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/pp-20260901-manuscript-reconciliation-phase-2'
        run: |
          firebase --project poetry-please deploy --only functions:manuscriptreconciliationphase2preview
          deployed_sa="$(gcloud functions describe manuscriptreconciliationphase2preview --gen2 --project poetry-please --region us-central1 --format='value(serviceConfig.serviceAccountEmail)')"
          test "$deployed_sa" = "manuscript-phase2-preview@poetry-please.iam.gserviceaccount.com"
          echo "Verified the deployed function uses the isolated runtime identity."

      - name: Allow HTTPS invocation of only the isolated preview function
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/pp-20260901-manuscript-reconciliation-phase-2'
        run: |
          set -euo pipefail
          gcloud run services add-iam-policy-binding manuscriptreconciliationphase2preview --project poetry-please --region us-central1 --member=allUsers --role=roles/run.invoker --quiet
          invoker="$(gcloud run services get-iam-policy manuscriptreconciliationphase2preview --project poetry-please --region us-central1 --flatten='bindings[].members' --filter='bindings.role=roles/run.invoker AND bindings.members=allUsers' --format='value(bindings.members)')"
          test "$invoker" = "allUsers"
          echo "Verified public HTTPS invocation for the isolated preview function; application routes still enforce Firebase team/admin authorization."

      - name: Verify canonical Catalog integration through preview function
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/pp-20260901-manuscript-reconciliation-phase-2'
        run: |
          response_file="$RUNNER_TEMP/manuscript-phase2-health.json"
          status="$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 --output "$response_file" --write-out '%{http_code}' \
            "https://us-central1-poetry-please.cloudfunctions.net/manuscriptreconciliationphase2preview/healthz")"
          node -e 'const fs=require("fs"); const status=Number(process.argv[1]); const raw=fs.readFileSync(process.argv[2],"utf8"); let p={}; let responseType="json"; try{p=JSON.parse(raw)}catch{responseType="non_json"} const clean=(v)=>typeof v==="string"?v.slice(0,240):null; console.log(JSON.stringify({httpStatus:status,responseType,error:clean(p.error),message:clean(p.message)})); if(status!==200||p.ok!==true||p.catalogBase!=="https://button-poetry-catalog-phase2-preview-350789123099.us-central1.run.app"||typeof p.revision!=="string"||!p.revision.startsWith("manuscriptreconciliationphase2preview-")||p.reconciliationId!==1||p.safeWritableResolutionId!==900001||!Number.isInteger(p.writeRevision)) process.exit(1); console.log(JSON.stringify({ok:p.ok,catalogBase:p.catalogBase,revision:p.revision,reconciliationId:p.reconciliationId,safeWritableResolutionId:p.safeWritableResolutionId,writeRevision:p.writeRevision}))' "$status" "$response_file"

      - name: Route only the isolated Hosting channel to the Phase 2 function
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/pp-20260901-manuscript-reconciliation-phase-2'
        run: |
          node -e 'const fs=require("fs"); const path="firebase.json"; const config=JSON.parse(fs.readFileSync(path,"utf8")); const rule=config.hosting.rewrites.find((item)=>item.source==="/api/admin/manuscriptReconciliations/**"); if(rule?.function?.functionId!=="manuscriptreconciliationpreview") process.exit(2); rule.function.functionId="manuscriptreconciliationphase2preview"; fs.writeFileSync(path,JSON.stringify(config,null,2)+"\n");'

      - name: Deploy Hosting Preview (branch channel)
        if: github.event_name == 'push'
        run: |
          BRANCH="${{ github.ref_name }}"
          CHANNEL=$(echo "$BRANCH" | tr '/_' '-' | tr -cd '[:alnum:]-' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-40)
          if [ -z "$CHANNEL" ]; then
            echo "Could not derive a valid preview channel from branch: $BRANCH"; exit 5
          fi
          echo "Deploying preview channel: $CHANNEL"
          firebase hosting:channel:deploy "$CHANNEL" --project poetry-please --expires 7d

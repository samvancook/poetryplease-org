name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - '**'        # run on every branch push (for previews)
  pull_request:
    branches:
      - '**'        # run on PRs too
  workflow_dispatch:  # allow manual runs from the Actions tab
  
jobs:
  test_functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Validate function modules
        working-directory: functions
        run: |
          node --check index.js
          node --check import-jobs.js
          node --check manuscript-reconciliation-phase2.js

      - name: Run function tests
        working-directory: functions
        run: node --test uploader-helpers.test.js manuscript-reconciliation-phase2.test.js

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase CLI for emulator tests
        run: npm install --global firebase-tools

      - name: Write synthetic emulator secret overrides
        working-directory: functions
        run: printf "%s\\n" "POETRY_PLEASE_API_KEY=emulator-only" "PIG_POETRY_PLEASE_API_KEY=emulator-only" > .secret.local

      - name: Run isolated authorization emulator integration test
        env:
          GCLOUD_PROJECT: demo-poetry-please
          FIREBASE_CONFIG: '{"projectId":"demo-poetry-please"}'
        run: firebase emulators:exec --project demo-poetry-please --only auth,firestore,functions "node --test functions/manuscript-reconciliation.emulator.test.js"

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine changed areas
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            functions:
              - 'functions/**'
              - '.github/workflows/firebase.yml'
            hosting:
              - 'public/**'
              - 'firebase.json'
              - '.firebaserc'
              - 'index.html'
              - 'mobile.html'
              - 'detect.html'
              - 'app.js'
              - 'styles.css'

      - name: Debug paths-filter outputs
        run: |
          echo "functions changed? -> ${{ steps.changes.outputs.functions }}"
          echo "hosting   changed? -> ${{ steps.changes.outputs.hosting }}"
          echo "Changed files vs previous commit:"
          git --no-pager diff --name-only HEAD~1 HEAD || true

      - name: Show repo tree (top level)
        run: ls -la

      - name: Print firebase.json and .firebaserc if present
        run: |
          test -f firebase.json && echo "=== firebase.json ===" && cat firebase.json || echo "firebase.json NOT FOUND"
          test -f .firebaserc  && echo "=== .firebaserc  ===" && cat .firebaserc  || echo ".firebaserc NOT FOUND"

      - name: Functions deps (if functions/ changed)
        if: steps.changes.outputs.functions == 'true'
        run: |
          echo "Installing functions deps…"
          cd functions
          if [ -f package.json ]; then
            npm install --no-audit --no-fund
          else
            echo "functions/package.json NOT FOUND"; exit 2
          fi

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POETRY_PLEASE }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Secret FIREBASE_SERVICE_ACCOUNT_POETRY_PLEASE is EMPTY or missing"; exit 3
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > $RUNNER_TEMP/gcloud-key.json
          echo "Key written to $RUNNER_TEMP/gcloud-key.json"

      - name: Verify production API-key secrets
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud-key.json
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          gcloud config set project poetry-please --quiet
          for secret in POETRY_PLEASE_API_KEY PIG_POETRY_PLEASE_API_KEY; do
            gcloud secrets describe "$secret" --project poetry-please >/dev/null
            test -n "$(gcloud secrets versions list "$secret" --project poetry-please --filter='state=ENABLED' --format='value(name)' --limit=1)"
          done
          echo "Required Poetry Please secret bindings are present."

      - name: Firebase whoami / projects (sanity)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud-key.json
        run: |
          firebase --version
          firebase projects:list --json || true
          firebase use poetry-please || true

      - name: Deploy Hosting (debug)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud-key.json
        run: |
          if [ -f firebase.json ]; then
            echo "Deploying HOSTING…"
            firebase --project poetry-please deploy --only hosting:poetryplease-org --debug
          else
            echo "Skipping hosting: firebase.json missing"; exit 4
          fi

      - name: Deploy Functions (debug)
        if: steps.changes.outputs.functions == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud-key.json
        run: |
          echo "Deploying FUNCTIONS…"
          firebase --project poetry-please deploy --only functions --debug

      - name: Authenticated internal API smoke tests
        if: steps.changes.outputs.functions == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud-key.json
        run: |
          set -euo pipefail
          poetry_key="$(gcloud secrets versions access latest --secret=POETRY_PLEASE_API_KEY --project poetry-please)"
          pig_key="$(gcloud secrets versions access latest --secret=PIG_POETRY_PLEASE_API_KEY --project poetry-please)"
          trap 'unset poetry_key pig_key' EXIT
          curl --fail --silent --show-error --retry 6 --retry-delay 10             -H "x-api-key: $poetry_key"             "https://poetryplease.org/api/internal/repairRequests?status=requested" >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 10             -H "x-api-key: $pig_key"             "https://poetryplease.org/api/internal/coverageCounts?lane=INT_FPI" >/dev/null
          echo "Authenticated Poetry Please smoke tests passed."


      - name: Apply safe P.I.G. ID hygiene migration
        if: steps.changes.outputs.functions == 'true' && contains(github.event.head_commit.message, '[apply-pig-hygiene]')
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud-key.json
        run: |
          set -euo pipefail
          poetry_key="$(gcloud secrets versions access latest --secret=POETRY_PLEASE_API_KEY --project poetry-please)"
          trap 'unset poetry_key' EXIT
          curl --fail --silent --show-error --retry 6 --retry-delay 10 \
            -X POST \
            -H "x-api-key: $poetry_key" \
            "https://poetryplease.org/api/internal/idHygiene/applyPig"
          echo
          echo "Safe P.I.G. ID hygiene migration completed."


  # ------------------------------------------------------------
  # DEPLOY PREVIEW CHANNEL for non-main branches
  # ------------------------------------------------------------
  deploy_preview:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install preview function dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/pp-20260901-manuscript-reconciliation-phase-2'
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POETRY_PLEASE }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Secret FIREBASE_SERVICE_ACCOUNT_POETRY_PLEASE is EMPTY or missing"; exit 3
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > $RUNNER_TEMP/gcloud-key.json
          echo "Key written to $RUNNER_TEMP/gcloud-key.json"

      - name: Verify an isolated Phase 2 runtime identity exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/pp-20260901-manuscript-reconciliation-phase-2'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud-key.json
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          runtime_sa="manuscript-phase2-preview@poetry-please.iam.gserviceaccount.com"
          echo "Existing Poetry Please service-account emails:"
          gcloud iam service-accounts list --project poetry-please --format='value(email)'
          echo "Cloud Run services and runtime identities:"
          gcloud run services list --project poetry-please --region us-central1 --format='table(metadata.name,spec.template.spec.serviceAccountName)'
          echo "IAM roles attached to the possible existing dedicated identity:"
          gcloud projects get-iam-policy poetry-please --flatten='bindings[].members' --filter='bindings.members:serviceAccount:poetryplease@poetry-please.iam.gserviceaccount.com' --format='value(bindings.role)'
          if ! gcloud iam service-accounts describe "$runtime_sa" --project poetry-please >/dev/null 2>&1; then
            echo "Required isolated runtime identity is absent: $runtime_sa"
            exit 7
          fi
          echo "Required isolated runtime identity exists."

      - name: Deploy isolated manuscript reconciliation preview function
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/pp-20260901-manuscript-reconciliation-phase-2'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud-key.json
        run: |
          firebase --project poetry-please deploy --only functions:manuscriptreconciliationphase2preview

      - name: Verify canonical Catalog integration through preview function
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/pp-20260901-manuscript-reconciliation-phase-2'
        run: |
          response="$(curl --fail --silent --show-error --retry 8 --retry-delay 10 \
            "https://us-central1-poetry-please.cloudfunctions.net/manuscriptreconciliationphase2preview/healthz")"
          node -e 'const p=JSON.parse(process.argv[1]); if(p.ok!==true||p.catalogBase!=="https://button-poetry-catalog-phase2-preview-350789123099.us-central1.run.app"||typeof p.revision!=="string"||!p.revision.startsWith("manuscriptreconciliationphase2preview-")||p.reconciliationId!==1||p.safeWritableResolutionId!==900001||!Number.isInteger(p.writeRevision)) process.exit(1); console.log(JSON.stringify({ok:p.ok,catalogBase:p.catalogBase,revision:p.revision,reconciliationId:p.reconciliationId,safeWritableResolutionId:p.safeWritableResolutionId,writeRevision:p.writeRevision}))' "$response"

      - name: Deploy Hosting Preview (branch channel)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud-key.json
        run: |
          BRANCH="${{ github.ref_name }}"
          CHANNEL=$(echo "$BRANCH" | tr '/_' '-' | tr -cd '[:alnum:]-' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-40)
          if [ -z "$CHANNEL" ]; then
            echo "Could not derive a valid preview channel from branch: $BRANCH"; exit 5
          fi
          echo "Deploying preview channel: $CHANNEL"
          firebase hosting:channel:deploy "$CHANNEL" --project poetry-please --expires 7d

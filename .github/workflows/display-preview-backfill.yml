name: Display preview backfill

# Run by hand from the Actions tab. It deploys nothing.
#   status        read-only count of graphics with and without a light preview
#   request       asks for previews on the next <limit> graphics that need one
#   retry-stalled asks again for graphics requested earlier that still have none
#   refresh-feed  one content-cache refresh so finished previews reach the feed
# Previews are built by the graphicdisplaypreview function. Originals are never
# modified, and a preview is removed by clearing its fields on the graphic.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        required: true
        default: status
        options: [status, request, retry-stalled, refresh-feed]
      limit:
        description: How many graphics to request (1-100); used by request and retry-stalled
        required: false
        default: '25'

permissions:
  contents: read
  id-token: write

concurrency:
  group: display-preview-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/609992589187/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: firebase-adminsdk-k1gj0@poetry-please.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Run
        env:
          ACTION: ${{ inputs.action }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          case "$LIMIT" in ''|*[!0-9]*) echo "limit must be a whole number"; exit 2;; esac
          poetry_key="$(gcloud secrets versions access latest --secret=POETRY_PLEASE_API_KEY --project poetry-please)"
          trap 'unset poetry_key' EXIT
          base="https://poetryplease.org/api/internal/displayPreviews"
          status() {
            curl --fail-with-body --silent --show-error --max-time 120 -H "x-api-key: $poetry_key" "$base/status" | jq .
          }
          post() {
            curl --fail-with-body --silent --show-error --max-time 600 -X POST \
              -H "x-api-key: $poetry_key" -H "Content-Type: application/json" -d "$2" "$base/$1" | jq .
          }
          case "$ACTION" in
            status) status ;;
            request) post request "{\"limit\":$LIMIT}"; echo "Waiting for the previews to build..."; sleep 90; status ;;
            retry-stalled) post request "{\"limit\":$LIMIT,\"retryStalled\":true}"; echo "Waiting for the previews to build..."; sleep 90; status ;;
            refresh-feed) post refreshFeed '{}' ;;
            *) echo "unknown action"; exit 2 ;;
          esac

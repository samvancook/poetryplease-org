<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Detecting…</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    html,body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    .wrap { max-width: 680px; margin: 18vh auto 0; padding: 16px; color:#222; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    .hint { opacity:.7; font-size:13px; margin-top:10px; }
    code { background:#f4f5f7; padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Detecting your device…</h1>
    <div id="msg" class="hint">Just a moment.</div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      if (params.get("noredirect") === "1") {
        document.getElementById("msg").textContent = "Debug mode: noredirect=1 — no redirect will occur.";
        return;
      }

      const requested = params.get("view");
      const explicit = requested === "mobile" || requested === "desktop" ? requested
        : params.get("mobile") === "1" ? "mobile"
        : params.get("desktop") === "1" ? "desktop" : null;
      const ua = navigator.userAgent || "";
      const mobileDevice = /Mobi|Android|iPhone|iPad|iPod/i.test(ua)
        || navigator.userAgentData?.mobile === true
        || (/Mac/.test(navigator.platform || "") && navigator.maxTouchPoints > 1);
      // A saved preview, narrow window or touchscreen desktop is not a phone.
      const decided = explicit || (mobileDevice ? "mobile" : "desktop");
      const target = decided === "mobile" ? "/m" : "/app";

      ["mobile", "desktop", "noredirect"].forEach(key => params.delete(key));
      // Carry explicit overrides through /app so its mobile guard agrees.
      if (explicit) params.set("view", explicit);
      else params.delete("view");
      const query = params.toString();
      location.replace(target + (query ? "?" + query : "") + (location.hash || ""));
    })();
  </script>
</body>
</html>

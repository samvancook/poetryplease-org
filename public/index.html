<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Poetry, Please</title>
  <link rel="icon" type="image/png" href="/pp-loader-logo.png" />
  <link rel="apple-touch-icon" href="/pp-loader-logo.png" />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
  <link rel="stylesheet" href="/style.css?v=20260320a"/>
  <style>
    html, body {
      background: #faf7f0;
      color: #111;
    }
    .pp-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(47, 93, 98, 0.22), transparent 40%),
        linear-gradient(180deg, #faf7f0 0%, #f4ecdd 100%);
      opacity: 1;
      visibility: visible;
      transition: opacity 420ms ease, visibility 420ms ease;
    }
    .pp-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .pp-loader__mark {
      width: min(46vw, 220px);
      opacity: 0;
      transform: translateY(10px) scale(0.94);
      animation: ppLoaderFadeIn 900ms ease forwards;
      filter: drop-shadow(0 18px 32px rgba(30, 26, 21, 0.14));
    }
    .pp-loader__content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .pp-loader__text {
      font: 600 14px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(30, 26, 21, 0.68);
    }
    .pp-loader__reset {
      border: 1px solid rgba(30, 26, 21, 0.12);
      background: rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      padding: 8px 12px;
      font: 600 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: rgba(30, 26, 21, 0.72);
      cursor: pointer;
    }
    .pp-loader__dots {
      display: inline-block;
      width: 3ch;
      text-align: left;
    }
    .pp-loader__dots::after {
      content: "";
      animation: ppLoaderDots 1.2s steps(4, end) infinite;
    }
    @keyframes ppLoaderFadeIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    @keyframes ppLoaderDots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75%,
      100% { content: "..."; }
    }
  </style>

  <!-- Firebase (compat) SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>

  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyDhDlg_3VjDTfamRvjcsguqMaiFS3DogT8",
      authDomain: "poetry-please.firebaseapp.com",
      projectId: "poetry-please",
      storageBucket: "poetry-please.firebasestorage.app",
      messagingSenderId: "609992589187",
      appId: "1:609992589187:web:ea8aed51a08c3716b880b6",
      measurementId: "G-FBLJHKQ70B"
    };
    firebase.initializeApp(FIREBASE_CONFIG);
    window.addEventListener('load', () => {
      const loadAnalytics = () => {
        const script = document.createElement('script');
        script.src = 'https://www.gstatic.com/firebasejs/10.14.0/firebase-analytics-compat.js';
        script.async = true;
        script.onload = () => {
          try {
            firebase.analytics().logEvent('page_view');
          } catch (err) {
            console.warn('Analytics init skipped', err);
          }
        };
        document.head.appendChild(script);
      };

      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadAnalytics, { timeout: 2000 });
      } else {
        setTimeout(loadAnalytics, 800);
      }
    }, { once: true });
  </script>
  <style>
    #login-screen,
    #registration-screen {
      width: min(92vw, 460px);
      margin: 48px auto;
      padding: 28px;
      border: 1px solid #dad0c1;
      border-radius: 20px;
      background: rgba(255, 253, 248, 0.96);
      box-shadow: 0 18px 50px rgba(30, 26, 21, 0.14);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #login-screen h1,
    #registration-screen h1 {
      margin: 0 0 10px;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.1;
    }
    .auth-intro {
      margin: 0 0 20px;
      color: #6c6558;
      line-height: 1.5;
    }
    #email-login-form,
    #registration-form {
      display: grid;
      gap: 12px;
      margin: 16px 0 12px;
    }
    #login-screen input,
    #registration-screen input {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #bfb5a6;
      border-radius: 10px;
      font: inherit;
      background: #fff;
    }
    #login-screen button,
    #registration-screen button {
      width: 100%;
      min-height: 44px;
      margin: 6px 0 0;
      padding: 10px 14px;
      border: 1px solid #2f5d62;
      border-radius: 10px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    #login-google,
    #email-login-form button[type="submit"],
    #registration-form button[type="submit"] {
      background: #2f5d62;
      color: #fff;
    }
    #forgot-password,
    #show-registration,
    #show-login,
    #continue-without-login {
      background: #fff;
      color: #2f5d62;
    }
    #password-reset-status,
    #login-status {
      min-height: 1.4em;
      margin-top: 8px;
      color: #6c6558;
      line-height: 1.4;
    }
    @media (max-width: 600px) {
      #login-screen,
      #registration-screen {
        width: calc(100vw - 24px);
        margin: 18px auto;
        padding: 22px 18px;
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <div id="pp-loader" class="pp-loader" aria-hidden="true">
    <div class="pp-loader__content">
      <img class="pp-loader__mark" src="/pp-loader-logo.png?v=20260323b" alt="" decoding="async" />
      <div class="pp-loader__text">Loading<span class="pp-loader__dots" aria-hidden="true"></span></div>
      <button id="pp-loader-reset" class="pp-loader__reset" type="button">Reset app state</button>
    </div>
  </div>
  <div id="user-status"></div>

  <div id="type-filter-container">
    <label for="type-filter">Filter by Image Type:</label>
    <select id="type-filter">
      <option value="">All Types</option>
    </select>
  </div>

  <div id="catalog-filter-container">
    <label for="catalog-filter">Filter by Release Catalog:</label>
    <select id="catalog-filter">
      <option value="">All Releases</option>
    </select>
  </div>

  <div id="book-filter-container">
    <label for="book-filter">Filter by Book:</label>
    <select id="book-filter">
      <option value="">All Books</option>
    </select>
  </div>

  <div id="event-filter-container">
    <label for="event-filter">Filter by Event:</label>
    <select id="event-filter">
      <option value="">All Events</option>
    </select>
  </div>

  <div id="queue-mode-container">
    <label for="queue-mode-filter">Queue Mode:</label>
    <select id="queue-mode-filter">
      <option value="ranked">Ranked review</option>
      <option value="import-order">Newest/import order</option>
      <option value="needs-attention">Needs attention</option>
      <option value="zero-votes">Zero votes first</option>
    </select>
  </div>

  <div id="login-screen" style="display:none">
    <h1>Welcome to Poetry, Please</h1>
    <p class="auth-intro">Button Authors should use the same email address that received their invitation. Everyone else can log in or create an account to save activity across devices.</p>
    <button id="login-google" type="button">Continue with Google</button>
    <form id="email-login-form">
      <input type="email" id="email" placeholder="Email" autocomplete="email" required />
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">Log in</button>
    </form>
    <button id="forgot-password" type="button">Reset password</button>
    <div id="password-reset-status" role="status" aria-live="polite"></div>
    <div id="login-status" role="status" aria-live="polite"></div>
    <button id="show-registration">Create an Account</button>
    <button id="continue-without-login" type="button">Continue without logging in</button>
  </div>

  <div id="registration-screen" style="display:none">
    <h1>Create an Account</h1>
    <form id="registration-form">
      <input type="email" id="reg-email" placeholder="Email" required />
      <input type="password" id="reg-password" placeholder="Password" required />
      <button type="submit">Sign Up</button>
    </form>
    <button id="show-login">Back to Login</button>
  </div>

  <div id="poetry-screen">
    <h1 id="page-title">Poetry, Please!</h1>
    <div class="button-container">
      <button id="load-button" disabled>Poetry, Please</button>
    </div>
    <div id="error" class="error"></div>
    <div id="message" class="message"></div>
    <div id="gallery" class="gallery"></div>
  </div>

  <script src="/app.js?v=20260827b"></script>
</body>
</html>

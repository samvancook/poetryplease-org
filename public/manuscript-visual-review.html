<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manuscript Reconciliation Phase 4 · Poetry Please Admin</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <style>
    :root{--ink:#17221c;--muted:#647168;--paper:#fbfaf5;--panel:#fff;--line:#d9ded7;--accent:#1e684a;--warn:#8a4b08;--red:#8a2424}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,sans-serif}nav{display:flex;gap:18px;align-items:center;padding:14px 22px;background:#15231c;color:#fff;overflow:auto}nav a{color:#fff;text-decoration:none;white-space:nowrap}nav strong{margin-right:auto}.banner{padding:10px 22px;text-align:center;background:#dcece3;color:#174c36;font-weight:800}.workspace{display:grid;grid-template-columns:minmax(250px,320px) minmax(0,1fr);max-width:1700px;margin:auto;gap:16px;padding:24px}.queue,.detail{background:var(--panel);border:1px solid var(--line);border-radius:12px}.queue{padding:16px;height:fit-content}.detail{padding:24px;min-width:0}.eyebrow{margin:0;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-size:12px;font-weight:800}.muted{color:var(--muted)}h1,h2,h3{line-height:1.2}.queue h2{margin:.3rem 0}.queue-items{display:grid;gap:8px;max-height:72vh;overflow:auto}.queue-item{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:11px;cursor:pointer}.queue-item.selected{border-color:var(--accent);box-shadow:inset 4px 0 var(--accent)}.queue-item small{color:var(--muted)}.pill,.status{width:max-content;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:800}.pending{background:#fff2c7;color:#684700}.confirmed{background:#dcece3;color:#174c36}.followup{background:#f8dfd8;color:var(--red)}.status{margin:14px 0}.source-view,.evidence{margin-top:20px;padding:18px;background:#f7f8f4;border:1px solid var(--line);border-radius:10px}.inspection{padding:10px 12px;border-left:4px solid var(--warn);background:#fff6df}.page-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.source-page{min-width:0}.source-page h3{margin:.25rem 0 .6rem;font-size:14px}.source-page iframe{width:100%;height:680px;border:1px solid var(--line);background:#fff}.source-loading{min-height:220px;display:grid;place-items:center;color:var(--muted);border:1px dashed var(--line);background:#fff}.open-source{color:var(--accent);font-weight:800}.evidence label{display:grid;gap:5px;margin:12px 0;font-weight:800}.evidence select,.evidence textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}.evidence textarea{min-height:110px;resize:vertical}.evidence button{padding:10px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:800}.evidence button:disabled{opacity:.5}.message{min-height:1.4em;color:var(--accent);font-weight:800}.evidence-history{padding-left:20px}.evidence-history li{margin:10px 0}.evidence-history small{display:block;color:var(--muted);margin-top:3px}.state,.empty{max-width:760px;margin:10vh auto;padding:32px;text-align:center}.error{color:var(--red)}@media(max-width:900px){.workspace{grid-template-columns:1fr;padding:14px}.page-grid{grid-template-columns:1fr}.source-page iframe{height:560px}.queue-items{max-height:300px}}@media(max-width:520px){.detail{padding:16px}nav{padding:12px 14px}.source-page iframe{height:460px}}
  </style>
</head>
<body>
  <div id="visual-review-app" aria-live="polite"></div>
  <script type="module" src="/manuscript-visual-review.js"></script>
</body>
</html>

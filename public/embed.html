<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Poetry, Please</title>
  <link rel="icon" type="image/png" href="/pp-loader-logo.png"/>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      background: transparent;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 280px;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    body {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
    }
    button {
      font: inherit;
    }
    #stage {
      position: relative;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: #f7f1e5;
      border: 1px solid rgba(34, 28, 20, 0.22);
      cursor: pointer;
    }
    #stage:focus-visible {
      outline: 3px solid #3f6b70;
      outline-offset: -3px;
    }
    #stage[data-state="loading"]::after {
      content: "";
      width: 34px;
      height: 34px;
      border: 3px solid rgba(63, 107, 112, 0.18);
      border-top-color: #3f6b70;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #stage[data-state="ready"]::after {
      content: "Open in Poetry Please";
      position: absolute;
      right: 12px;
      bottom: 12px;
      padding: 7px 10px;
      border-radius: 4px;
      background: rgba(247, 241, 229, 0.94);
      color: #284f54;
      font: 600 13px/1.2 Arial, sans-serif;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 140ms ease, transform 140ms ease;
      pointer-events: none;
    }
    #stage[data-state="ready"]:hover::after,
    #stage[data-state="ready"]:focus-visible::after {
      opacity: 1;
      transform: translateY(0);
    }
    #content {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      overflow: hidden;
    }
    #metadata {
      display: none;
      width: 100%;
      padding: 12px 16px 13px;
      border-top: 1px solid rgba(34, 28, 20, 0.16);
      background: rgba(247, 241, 229, 0.98);
      color: #191612;
    }
    #metadata[data-visible="true"] {
      display: block;
    }
    #meta-title {
      display: block;
      font-size: clamp(16px, 3.4vw, 20px);
      font-weight: 700;
      line-height: 1.25;
    }
    #meta-byline {
      display: block;
      margin-top: 3px;
      color: #5d574e;
      font: 14px/1.35 Arial, sans-serif;
    }
    #controls {
      display: none;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 8px;
      border: 1px solid rgba(34, 28, 20, 0.22);
      border-top: 0;
      background: #f7f1e5;
      font: 13px/1.2 Arial, sans-serif;
    }
    #controls[data-visible="true"] { display: flex; }
    #controls button {
      padding: 7px 9px;
      border: 1px solid #c9c0b1;
      border-radius: 4px;
      background: #fff;
      color: #284f54;
      font: 600 13px/1.2 Arial, sans-serif;
      cursor: pointer;
    }
    #controls button:focus-visible { outline: 2px solid #3f6b70; outline-offset: 2px; }
    #controls button:disabled { opacity: 0.45; cursor: default; }
    #position { min-width: 45px; text-align: center; white-space: nowrap; }
    #collection { margin-left: auto; }
    .media-image,
    .media-video,
    .media-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: contain;
      background: #f7f1e5;
    }
    .poem {
      width: min(100%, 760px);
      max-height: 100%;
      margin: 0;
      padding: clamp(20px, 6vw, 54px);
      overflow: auto;
      white-space: pre-wrap;
      color: #191612;
      font-size: clamp(17px, 3.8vw, 25px);
      line-height: 1.48;
      text-align: left;
      scrollbar-width: thin;
    }
    .poem-title {
      display: block;
      margin-bottom: 1.1em;
      font-size: 0.84em;
      font-weight: 700;
      text-transform: none;
    }
    .unavailable {
      padding: 24px;
      color: #625f58;
      font: 16px/1.4 Arial, sans-serif;
      text-align: center;
      cursor: default;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #stage[data-state="loading"]::after { animation: none; }
    }
  </style>
</head>
<body>
  <main id="stage" data-state="loading" tabindex="0" role="link" aria-label="Open this poem in Poetry Please">
    <div id="content"></div>
    <div id="metadata" aria-live="polite">
      <span id="meta-title"></span>
      <span id="meta-byline"></span>
    </div>
  </main>
  <nav id="controls" aria-label="Embed controls">
    <button id="previous" type="button" aria-label="Previous item">Previous</button>
    <span id="position" aria-live="polite"></span>
    <button id="next" type="button" aria-label="Next item">Next</button>
    <button id="rotation" type="button">Pause</button>
    <button id="collection" type="button">Explore collection</button>
  </nav>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const book = (params.get("book") || "").trim();
      const catalog = (params.get("catalog") || "").trim();
      const bookGroup = (params.get("bookGroup") || "").trim();
      const contestYear = (params.get("contestYear") || "").trim();
      const type = (params.get("type") || (bookGroup ? "QI" : "")).trim();
      const contestEvent = (params.get("event") || "").trim();
      const prefer = (params.get("prefer") || "").trim();
      const month = new Date().toISOString().slice(0, 7);
      const stage = document.getElementById("stage");
      const content = document.getElementById("content");
      const metadata = document.getElementById("metadata");
      const metaTitle = document.getElementById("meta-title");
      const metaByline = document.getElementById("meta-byline");
      const controls = document.getElementById("controls");
      const previousButton = document.getElementById("previous");
      const nextButton = document.getElementById("next");
      const position = document.getElementById("position");
      const rotationButton = document.getElementById("rotation");
      const collectionButton = document.getElementById("collection");
      let rotationPaused = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let pool = [];
      let index = 0;
      let current = null;

      const text = (value) => String(value || "").trim();
      const typeKey = (item) => text(item && item.imageType).toUpperCase();
      const deepLink = (item) => {
        if (catalog === "Contest" && type.toUpperCase() === "QI" && contestEvent) {
          const winners = new URL("/posts-swipe", location.origin);
          winners.searchParams.set("catalog", catalog);
          winners.searchParams.set("event", contestEvent);
          winners.searchParams.set("type", type);
          winners.searchParams.set("locked", "1");
          winners.searchParams.set("reading", "1");
          return winners.pathname + winners.search;
        }
        if (bookGroup === "chapbook-winners") {
          const target = new URL("/", location.origin);
          target.searchParams.set("bookGroup", bookGroup);
          target.searchParams.set("type", type);
          if (contestYear) target.searchParams.set("contestYear", contestYear);
          if (book) target.searchParams.set("book", book);
          if (item && item.id) target.searchParams.set("item", item.id);
          return target.pathname + target.search;
        }
        const targetBook = text(item && item.book) || book;
        const targetCatalog = text(item && item.releaseCatalog) || catalog;
        const target = new URL("/app", location.origin);
        if (item && item.id) target.searchParams.set("item", item.id);
        if (targetBook) target.searchParams.set("book", targetBook);
        if (targetCatalog) target.searchParams.set("catalog", targetCatalog);
        if (type) target.searchParams.set("type", type);
        target.searchParams.set("locked", "1");
        return target.pathname + target.search;
      };

      function youtubeEmbed(url) {
        const match = text(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
        return match ? "https://www.youtube.com/embed/" + match[1] + "?rel=0" : "";
      }

      function drivePreview(url) {
        const match = text(url).match(/drive\.google\.com\/file\/d\/([^/]+)/);
        return match ? "https://drive.google.com/file/d/" + match[1] + "/preview" : "";
      }

      function updateControls() {
        controls.dataset.visible = current ? "true" : "false";
        if (!current) return;
        position.textContent = (index + 1) + " of " + pool.length;
        previousButton.disabled = pool.length < 2;
        nextButton.disabled = pool.length < 2;
        rotationButton.disabled = pool.length < 2;
        rotationButton.textContent = rotationPaused ? "Resume" : "Pause";
        rotationButton.setAttribute("aria-label", rotationPaused ? "Resume automatic rotation" : "Pause automatic rotation");
        collectionButton.textContent = catalog.toLowerCase() === "contest" && contestEvent ? "See all winners" : "Explore collection";
      }

      function render(item) {
        current = item;
        content.replaceChildren();
        metadata.dataset.visible = "false";
        metaTitle.textContent = "";
        metaByline.textContent = "";
        if (!item) {
          stage.dataset.state = "error";
          stage.removeAttribute("role");
          stage.removeAttribute("tabindex");
          content.innerHTML = '<div class="unavailable">No preview is available for this selection yet.</div>';
          updateControls();
          return;
        }

        const kind = typeKey(item);
        const mediaUrl = text(item.mediaUrl);
        const excerpt = text(item.excerpt);
        let node;

        if ((kind === "FP" || kind === "EXC") && excerpt) {
          node = document.createElement("div");
          node.className = "poem";
          const title = text(item.title);
          if (title) {
            const heading = document.createElement("span");
            heading.className = "poem-title";
            heading.textContent = title;
            node.appendChild(heading);
          }
          node.appendChild(document.createTextNode(excerpt));
        } else {
          const youtube = youtubeEmbed(mediaUrl);
          const drive = drivePreview(text(item.driveLink) || mediaUrl);
          if (youtube || kind === "YT") {
            node = document.createElement("iframe");
            node.className = "media-video";
            node.src = youtube || mediaUrl;
            node.title = text(item.title) || "Poetry video";
            node.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
            node.allowFullscreen = true;
          } else if (kind === "VV" && (drive || mediaUrl)) {
            if (drive) {
              node = document.createElement("iframe");
              node.className = "media-frame";
              node.src = drive;
              node.title = text(item.title) || "Poetry video";
              node.allow = "autoplay; encrypted-media";
              node.allowFullscreen = true;
            } else {
              node = document.createElement("video");
              node.className = "media-video";
              node.src = mediaUrl;
              node.title = text(item.title) || "Poetry video";
              node.controls = true;
              node.playsInline = true;
              node.preload = "metadata";
            }
          } else if (mediaUrl) {
            node = document.createElement("img");
            node.className = "media-image";
            node.src = mediaUrl;
            node.alt = [text(item.title), text(item.author)].filter(Boolean).join(" by ");
            node.loading = "eager";
            node.decoding = "async";
          } else if (excerpt) {
            node = document.createElement("div");
            node.className = "poem";
            node.textContent = excerpt;
          } else {
            render(null);
            return;
          }
        }

        content.appendChild(node);
        const title = text(item.title) || "Untitled";
        const author = text(item.author);
        const itemBook = text(item.book) || book;
        const contestName = catalog.toLowerCase() === "contest" ? contestEvent : "";
        const sourceLabel = contestName || (itemBook ? "from " + itemBook : "");
        metaTitle.textContent = title;
        metaByline.textContent = [
          author ? "by " + author : "",
          sourceLabel
        ].filter(Boolean).join(" · ");
        metadata.dataset.visible = "true";
        stage.dataset.state = "ready";
        stage.setAttribute("aria-label", ["Open", title, author ? "by " + author : "", sourceLabel, "in Poetry Please"].filter(Boolean).join(" "));
        stage.title = [title, author, contestName || itemBook].filter(Boolean).join(" — ");
        updateControls();
      }

      function openCurrent() {
        if (!current) return;
        window.open(deepLink(current), "_blank", "noopener,noreferrer");
      }

      function moveBy(delta) {
        if (pool.length < 2) return;
        rotationPaused = true;
        index = (index + delta + pool.length) % pool.length;
        render(pool[index]);
      }
      previousButton.addEventListener("click", () => moveBy(-1));
      nextButton.addEventListener("click", () => moveBy(1));
      rotationButton.addEventListener("click", () => {
        rotationPaused = !rotationPaused;
        updateControls();
      });
      collectionButton.addEventListener("click", () => {
        if (!current) return;
        const target = new URL(deepLink(current), location.origin);
        target.searchParams.delete("item");
        if (!bookGroup && !(catalog.toLowerCase() === "contest" && contestEvent)) {
          if (!book) target.searchParams.delete("book");
          if (!catalog) target.searchParams.delete("catalog");
        }
        window.open(target.pathname + target.search, "_blank", "noopener,noreferrer");
      });

      stage.addEventListener("click", (event) => {
        if (event.target.closest("iframe")) return;
        openCurrent();
      });
      stage.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openCurrent();
        }
      });

      if (!book && !catalog && !type && !bookGroup) {
        render(null);
        return;
      }

      const endpoint = new URL("/api/embedBookLead", location.origin);
      if (book) endpoint.searchParams.set("book", book);
      endpoint.searchParams.set("month", month);
      endpoint.searchParams.set("embedVersion", "4");
      if (bookGroup) endpoint.searchParams.set("bookGroup", bookGroup);
      if (contestYear) endpoint.searchParams.set("contestYear", contestYear);
      if (catalog) endpoint.searchParams.set("catalog", catalog);
      if (type) endpoint.searchParams.set("type", type);
      if (contestEvent) endpoint.searchParams.set("event", contestEvent);
      if (prefer) endpoint.searchParams.set("prefer", prefer);

      fetch(endpoint, { headers: { Accept: "application/json" } })
        .then((response) => {
          if (!response.ok) throw new Error("embed_feed_failed");
          return response.json();
        })
        .then((payload) => {
          pool = Array.isArray(payload.pool) ? payload.pool : [];
          render(payload.lead || pool[0] || null);
          if (pool.length > 1) {
            window.setInterval(() => {
              if (rotationPaused || document.hidden) return;
              index = (index + 1) % pool.length;
              render(pool[index]);
            }, 45000);
          }
        })
        .catch(() => render(null));
    })();
  </script>
</body>
</html>

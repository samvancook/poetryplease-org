  <style>
    .pp-loader {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(47, 93, 98, 0.2), transparent 36%),
        linear-gradient(180deg, #faf7f0 0%, #f4ecdd 100%);
      opacity: 1;
      visibility: visible;
      transition: opacity 420ms ease, visibility 420ms ease;
    }
    .pp-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .pp-loader__mark {
      width: min(44vw, 180px);
      opacity: 0;
      transform: translateY(10px) scale(0.94);
      animation: ppLoaderFadeIn 900ms ease forwards;
      filter: drop-shadow(0 18px 32px rgba(30, 26, 21, 0.14));
    }
    .pp-loader__content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .pp-loader__text {
      font: 600 13px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(30, 26, 21, 0.68);
    }
    .pp-loader__reset {
      border: 1px solid rgba(30, 26, 21, 0.12);
      background: rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      padding: 8px 12px;
      font: 600 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: rgba(30, 26, 21, 0.72);
      cursor: pointer;
    }
    .pp-loader__dots {
      display: inline-block;
      width: 3ch;
      text-align: left;
    }
    .pp-loader__dots::after {
      content: "";
      animation: ppLoaderDots 1.2s steps(4, end) infinite;
    }
    @keyframes ppLoaderFadeIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    @keyframes ppLoaderDots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75%,
      100% { content: "..."; }
    }
    .admin-preview-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      padding: 6px 10px;
      border: 1px solid #e6e6e6;
      border-radius: 999px;
      background: #f7f7f7;
      white-space: nowrap;
    }
    .admin-preview-toggle input {
      margin: 0;
      accent-color: #2f5d62;
    }

    #mobile-side-votes {
  position: relative;
  order: -1;
  width: 100%;
  box-sizing: border-box;
  padding: 8px 0 10px;
  display: grid;
  grid-template-columns: repeat(4, var(--mobile-vote-size, 58px));
  justify-content: center;
  gap: clamp(8px, 3vw, 18px);
  z-index: 5000;
  pointer-events: auto;
}


/* bottom bar full width buttons */
.controls {
  display: flex;
  gap: 10px;
  width: 100%;
}
.controls button {
  flex: 1;
}

/* media extends behind bottom bar */
.media-outer {
  padding-bottom: 0 !important;
}


.mobile-vote-btn {
  width: var(--mobile-vote-size, 58px);
  height: var(--mobile-vote-size, 58px);
  background: #ffffff;
  border: 2px solid #e6e6e6;

/* Make excerpt text white when shown on the black background */
#media-wrap .excerpt-text {
  color: #fff;

  padding: 8px;

}

    /* Viewport + layout scaffolding */
html, body { height: 100%; }
body { min-height: 100svh; } /* accounts for mobile browser chrome correctly */
.wrap { 
  height: calc(100svh - 58px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  min-height: 0;
  display: flex;
  flex-direction: column;
}

/* Make the media area flex to fill everything between header and the body padding */
.media-outer {
  position: relative;
  flex: 1;          /* take remaining vertical space */
  min-height: 0;    /* critical so children can shrink inside a flex column */
  display: flex;
  flex-direction: column;
  background: #000;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
}

/* Center the media and let it expand to the full available height */
#media-wrap{
  flex: 1;
  width: 100%;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 0;
  overflow: hidden;
  background: #000;
}
#media-wrap .int-media-box { height: 100%; max-height: 100%; min-height: 0; }
#media-wrap .text-media-box { height: 100%; max-height: 100%; overflow: hidden; }
#media-wrap .excerpt-card { max-height: 100%; overflow-y: auto; }

/* Media fills the box while preserving aspect ratio */
#media-wrap img,
#media-wrap video,
#media-wrap iframe{
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  display: block;
}

    .controls .mini{padding:var(--mobile-controls-padding-y) var(--mobile-controls-mini-pad-x);font-size:var(--mobile-controls-mini-font)}
    .controls button:active{transform:translateY(1px)}

    body[data-ui="mobile"] .inline-info,

  <script>
    (() => {
      const auth = firebase.auth();
      const toggle = document.getElementById('mobile-account-toggle');
      const menu = document.getElementById('mobile-account-menu');
      const signout = document.getElementById('mobile-signout');
      const closeMenu = () => { menu.hidden = true; toggle.setAttribute('aria-expanded', 'false'); };
      auth.onAuthStateChanged((user) => {
        toggle.hidden = !user || user.isAnonymous;
        if (toggle.hidden) closeMenu();
      });
      toggle.addEventListener('click', () => {
        menu.hidden = !menu.hidden;
        toggle.setAttribute('aria-expanded', String(!menu.hidden));
      });
      document.addEventListener('click', (event) => {
        if (!event.target.closest('.mobile-account')) closeMenu();
      });
      signout.addEventListener('click', async () => {
        signout.disabled = true;
        try {
          await auth.signOut();
          window.location.assign('/m');
        } catch (error) {
          signout.disabled = false;
          signout.textContent = 'Could not sign out. Try again.';
        }
      });
    })();
  </script>
